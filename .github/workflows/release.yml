name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch Lunar Client version
        id: lunar
        run: |
          python3 scripts/fetch_lunar_version.py >> "$GITHUB_OUTPUT" || echo "Version fetch failed, building without baked-in version"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: |
          ARGS=""
          if [ -n "${{ steps.lunar.outputs.lunarVersion }}" ]; then
            ARGS="-PlunarVersion=${{ steps.lunar.outputs.lunarVersion }} -PlunarGitCommit=${{ steps.lunar.outputs.lunarGitCommit }}"
          fi
          ./gradlew build $ARGS

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
